services:
  db:
    # Dev only: reachable from the host (psql, pgAdmin) but never from the network.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  client:
    environment:
      - NODE_ENV=development
    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
      - /app/client/node_modules
    command: npm run dev
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8192M

  server:
    environment:
      - NODE_ENV=development
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - /app/server/node_modules
    command: npm run dev
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8192M
