services:
  client:
    environment:
      - NODE_ENV=development
    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
      - /app/client/node_modules
    command: npm run dev
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8192M

  server:
    environment:
      - NODE_ENV=development
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - /app/server/node_modules
    command: npm run dev
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8192M
